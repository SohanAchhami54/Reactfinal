name: React Deploy CI/CD

on: 
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '33HOC/**'

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./33HOC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 33HOC/package-lock.json

      - name: Install Dependencies
        run: npm install
      
      - name: Run Tests 
        run: npm test -- --run

      - name: Build Project
        run: npm run build

      - name: Copy index.html to 404.html
        run: cp ./dist/index.html ./dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./33HOC/dist