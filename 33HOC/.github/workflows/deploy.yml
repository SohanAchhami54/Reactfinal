name: React Deploy CI/CD 
on: 
#when someone push code to github
push: 
branches:
  -main 

jobs:
  build-deploy: 
    run-on: ubuntu-latest
    
    steps:
      # Checkout the repository
     - name: Checkout code 
       uses: actions/checkout@v4 

       #Setup Node.js
     - name: Setup Node.js 
       uses: actions/setup-node@v4 
       with: 
       node-version: '20'
       cache: 'npm' 


       #Install Dependencies 
     - name: Install Dependencies 
       run: npm install 

       #Build Projects
     - name: Build Projects 
       run: npm run build 

      #Deploy to github pages 
     - name: Deploy to github pages 
       uses: peaceiris/actions-gh-pages@v3 
       with: 
         github_token: ${{secrets.GITHUB_TOKEN}}
         publish_dir: dist

      
